<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar dan Tabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUa5lG2lubx7KdDh5GE1bHfn9S3r5MWR6Wt5oE2saNQFgeN9T8YbWZ7s1eD3"
    crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/data-table.css') }}">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
     
      <ul class="menu">
        <li class="menu-item " onclick="window.location.href='/data'">
            <img class="icon"    src="{{ url_for('static', filename='assets/icon_home.png') }}" />
          <span>Dashboard</span>
        </li>
        <li class="menu-item " onclick="window.location.href='/lokasi'">
            <img class="icon" src="{{ url_for('static', filename='assets/icon_map.png') }}" />
            <span>Lokasi</span>
          </li>
        <!-- <li class="menu-item active" onclick="window.location.href='/polusi'">
          <img class="icon"    src="{{ url_for('static', filename='assets/icon_polusi.png') }}" />
          <span>Polusi</span>
        </li> -->
        <li class="menu-item" onclick="window.location.href='/klasifikasi'">
            <img class="icon"    src="{{ url_for('static', filename='assets/icon_kasifikasi.png') }}" />
          <span>Klasifikasi</span>
        </li>
       
      </ul>
      <div class="exit">
        <img class="icon"    src="{{ url_for('static', filename='assets/icon_exit.png') }}" />
        <span>Exit</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h1>Tabel Data</h1>
      <div class="table-actions">
        <button class="btn add-btn" id="openModalBtn">
          <img class="icon" src="{{ url_for('static', filename='assets/add-button.png') }}" alt="Tambah Icon" />
          Tambah
        </button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>SO2</th>
            <th>NO2</th>
            <th>O3</th>
            <th>CO</th>
            <th>PM10</th>
            <th>PM25</th>
            <th>HC</th>
            <th>KLASIFIKASI</th>
            <th>AKSI</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>INDONESIA</td>
            <td>
              <button class="btn edit-btn" onclick="openEditModal('1', 'INDONESIA')">
                <img class="icon" src="{{ url_for('static', filename='assets/edit.png') }}" alt="Edit Icon" />
                Edit
              </button>
              <button class="btn delete-btn" onclick="openDeleteModal('1', 'INDONESIA')">
                <img class="icon" src="{{ url_for('static', filename='assets/delete.png') }}" alt="Delete Icon" />
                Delete
              </button>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>JAKARTA</td>
            <td>
              <button class="btn edit-btn" onclick="openEditModal('2', 'JAKARTA')">
                <img class="icon" src="{{ url_for('static', filename='assets/edit.png') }}" alt="Edit Icon" />
                Edit
              </button>
              <button class="btn delete-btn" onclick="openDeleteModal('1', 'INDONESIA')">
                <img class="icon" src="{{ url_for('static', filename='assets/delete.png') }}" alt="Delete Icon" />
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


  <div class="modal" id="addModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h2>Tambah Lokasi</h2>
      <form id="addForm">
        <div class="form-group">
          <label for="id">ID</label>
          <input type="text" id="id" name="id" placeholder="Masukkan ID" required />
        </div>
        <div class="form-group">
          <label for="nama">Nama Lokasi</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lokasi" required />
        </div>
        <button type="submit" class="btn submit-btn">Submit</button>
      </form>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <!-- Tombol Close -->
      <span class="close-btn" id="closeEditModalBtn">&times;</span>
      <h2>Edit Lokasi</h2>
      <form id="editForm">
        <div class="form-group">
          <label for="edit-id">ID</label>
          <input type="text" id="edit-id" name="id" readonly />
        </div>
        <div class="form-group">
          <label for="edit-nama">Nama Lokasi</label>
          <input type="text" id="edit-nama" name="nama" required />
        </div>
        <button type="submit" class="btn submit-btn" style="background-color: #ffcc5c;">Simpan</button>
      </form>
    </div>
  </div>


    <!-- Modal Delete -->
    <div class="modal" id="deleteModal">
      <div class="modal-content">
        <!-- Tombol Close -->
        <span class="close-btn" id="closeDeleteModalBtn">&times;</span>
        <h2>Konfirmasi Hapus</h2>
        <p>Apakah Anda yakin ingin menghapus lokasi <strong id="delete-nama"></strong>?</p>
        <form id="deleteForm">
          <input type="hidden" id="delete-id" name="id" />
          <div class="modal-buttons">
        
            <button type="submit" class="btn submit-btn" style="background-color: #f85c4c; ">Hapus</button>
          </div>
        </form>
      </div>
    </div>
  

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
