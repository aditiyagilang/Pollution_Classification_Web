<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar dan Tabel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUa5lG2lubx7KdDh5GE1bHfn9S3r5MWR6Wt5oE2saNQFgeN9T8YbWZ7s1eD3"
      crossorigin="anonymous">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/data-table.css') }}">

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet">

  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">

        <ul class="menu">
          <li class="menu-item " onclick="window.location.href='/home'">
            <img class="icon"
              src="{{ url_for('static', filename='assets/icon_home.png') }}" />
            <span>Dashboard</span>
          </li>
          <li class="menu-item active" onclick="window.location.href='/lokasi'">
            <img class="icon"
              src="{{ url_for('static', filename='assets/icon_map.png') }}" />
            <span>Lokasi</span>
          </li>
          <!-- <li class="menu-item" onclick="window.location.href='/polusi'">
          <img class="icon"    src="{{ url_for('static', filename='assets/icon_polusi.png') }}" />
          <span>Polusi</span>
        </li> -->
          <li class="menu-item" onclick="window.location.href='/klasifikasi'">
            <img class="icon"
              src="{{ url_for('static', filename='assets/icon_kasifikasi.png') }}" />
            <span>Klasifikasi</span>
          </li>

        </ul>
        <div class="exit" onclick="window.location.href='/logout'">
          <img class="icon"
            src="{{ url_for('static', filename='assets/icon_exit.png') }}" />
          <span>Exit</span>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <h1>Tabel Data</h1>
        <div class="table-actions">
          <button class="btn add-btn" id="openAddModalBtn">
            <img class="icon"
              src="{{ url_for('static', filename='assets/add-button.png') }}"
              alt="Tambah Icon" />
            Tambah
          </button>

        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Lokasi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            {% for lokasi in lokasi_list %}
            <tr>
              <td>{{ lokasi[0] }}</td> <!-- Mengakses esp_id (indeks 0) -->
              <td>{{ lokasi[1] }}</td> <!-- Mengakses location (indeks 1) -->
              <td>
                <!-- Tombol Edit -->
                <button class="btn edit-btn"
                  onclick="openEditModal('{{ lokasi[0] }}', '{{ lokasi[1] }}')">
                  <img class="icon"
                    src="{{ url_for('static', filename='assets/edit.png') }}"
                    alt="Edit Icon" />
                  Edit
                </button>

                <!-- Tombol Delete -->
                <button class="btn delete-btn"
                  onclick="openDeleteModal('{{ lokasi[0] }}', '{{ lokasi[1] }}')">
                  <img class="icon"
                    src="{{ url_for('static', filename='assets/delete.png') }}"
                    alt="Delete Icon" />
                  Delete
                </button>

              </td>
            </tr>
            {% endfor %}
          </tbody>

        </table>

      </div>
    </div>

    <!-- Modal Add Data -->
    <div class="modal" id="addModal">
      <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2>Tambah Lokasi</h2>
        <form id="addForm">
          <div class="form-group">
            <label for="id">ID</label>
            <input type="text" id="id" name="id" placeholder="Masukkan ID"
              required />
          </div>
          <div class="form-group">
            <label for="nama">Nama Lokasi</label>
            <input type="text" id="nama" name="nama"
              placeholder="Masukkan Nama Lokasi" required />
          </div>
          <button type="submit" class="btn submit-btn">Submit</button>
        </form>
      </div>
    </div>
    <div id="message" style="color: green; font-weight: bold; margin-bottom: 10px;"></div>

    <!-- Modal Edit Data -->
    <div class="modal" id="editModal">
      <div class="modal-content">
        <span class="close-btn" id="closeEditModalBtn">&times;</span>
        <h2>Edit Lokasi</h2>
        <form id="editForm">
          <div class="form-group">
            <label for="edit-id">ID</label>
            <input type="text" id="edit-id" name="id" readonly />
          </div>
          <div class="form-group">
            <label for="edit-nama">Nama Lokasi</label>
            <input type="text" id="edit-nama" name="nama" required />
          </div>
          <button type="submit" class="btn submit-btn"
            style="background-color: #ffcc5c;">Simpan</button>
        </form>
      </div>
    </div>

    <!-- Modal Konfirmasi Hapus -->
    <div class="modal" id="deleteModal">
      <div class="modal-content">
        <span class="close-btn" id="closeDeleteModalBtn">&times;</span>
        <h2>Konfirmasi Hapus</h2>
        <p>Apakah Anda yakin ingin menghapus lokasi <strong
            id="delete-nama"></strong>?</p>
        <form id="deleteForm">
          <input type="hidden" id="delete-id" name="id" />
          <div class="modal-buttons">
            <button type="submit" class="btn submit-btn"
              style="background-color: #f85c4c;">Hapus</button>
          </div>
        </form>
      </div>
    </div>

    <script>
  // Fungsi untuk membuka modal tambah data
  document.getElementById('openAddModalBtn').addEventListener('click', function() {
    document.getElementById('addModal').style.display = 'block';  // Buka modal tambah
  });

  // Fungsi untuk menutup modal tambah
  document.getElementById('closeModalBtn').addEventListener('click', function() {
    document.getElementById('addModal').style.display = 'none';  // Tutup modal tambah
  });

  // Kirim Data Form Tambah Lokasi
  document.getElementById('addForm').addEventListener('submit', function(event) {
    event.preventDefault();  // Mencegah halaman reload

    const id = document.getElementById('id').value;
    const nama = document.getElementById('nama').value;

    const data = {
      id: id,
      nama: nama
    };

    // Mengirim data dengan AJAX (fetch)
    fetch('/add-esp', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      if (result.status === 'success') {
        alert('Lokasi berhasil ditambahkan');
        document.getElementById('addModal').style.display = 'none';
        document.getElementById('addForm').reset();  // Reset form
        location.reload();  // Reload halaman untuk melihat perubahan
      } else {
        alert('Gagal menambahkan lokasi: ' + result.reason);
      }
    })
    .catch(error => {
      alert('Error: ' + error);
    });
  });

  function openEditModal(id, nama) {
    // Mengisi form modal edit dengan data yang dipilih
    document.getElementById('edit-id').value = id;     // Set nilai ID
    document.getElementById('edit-nama').value = nama;   // Set nilai Nama Lokasi
    // Tampilkan modal edit
    document.getElementById('editModal').style.display = 'block';
  }

  // Fungsi untuk menutup modal edit
  document.getElementById('closeEditModalBtn').addEventListener('click', function() {
    document.getElementById('editModal').style.display = 'none';
  });

  // Mengirim data edit ke server melalui form edit
  document.getElementById('editForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Mencegah refresh halaman

    const id = document.getElementById('edit-id').value;
    const nama = document.getElementById('edit-nama').value;

    const data = { nama: nama }; // Data yang akan dikirim (hanya nama karena id tidak boleh diubah)

    // Mengirim data menggunakan fetch dengan metode PUT
    fetch(`/edit-esp/${id}`, {
  method: 'PUT',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify(data)
})
.then(response => response.json())
.then(result => {
  if (result.status === 'success') {
    // Tutup modal edit
    document.getElementById('editModal').style.display = 'none';
    // Tampilkan pesan sukses di elemen #message
    document.getElementById('message').textContent = 'Lokasi berhasil diubah';
    // Optional: Hapus pesan dan reload halaman setelah 2 detik
    setTimeout(() => {
      document.getElementById('message').textContent = '';
      location.reload();  // Reload halaman untuk melihat perubahan
    }, 2000);
  } else {
    alert('Gagal memperbarui lokasi: ' + result.reason);
  }
})
.catch(error => {
  alert('Error: ' + error);
});

  });

  // Fungsi untuk membuka modal hapus dengan menampilkan nama dan ID lokasi yang ingin dihapus
  function openDeleteModal(id, nama) {
    document.getElementById('delete-nama').textContent = nama; // Tampilkan nama lokasi pada modal hapus
    document.getElementById('delete-id').value = id;            // Set nilai ID lokasi untuk penghapusan
    document.getElementById('deleteModal').style.display = 'block'; // Tampilkan modal hapus
  }

  // Fungsi untuk menutup modal hapus
  document.getElementById('closeDeleteModalBtn').addEventListener('click', function() {
    document.getElementById('deleteModal').style.display = 'none';
  });

  // Mengirim data penghapusan ke server melalui form hapus
  document.getElementById('deleteForm').addEventListener('submit', function(event) {
    event.preventDefault(); // Mencegah refresh halaman

    const id = document.getElementById('delete-id').value;

    // Mengirim request DELETE ke server
    fetch(`/delete-esp/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    })
    .then(response => response.json())
    .then(result => {
      if (result.status === 'success') {
        alert('Lokasi berhasil dihapus');
        document.getElementById('deleteModal').style.display = 'none';
        location.reload(); // Reload halaman untuk melihat perubahan
      } else {
        alert('Gagal menghapus lokasi: ' + result.reason);
      }
    })
    .catch(error => {
      alert('Error: ' + error);
    });
  });
</script>

  </body>
</html>
