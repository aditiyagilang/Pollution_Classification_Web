<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict ISPU</title>
</head>
<body>
    <h1>Predict ISPU</h1>
    <form method="POST">
        <label for="pm10">PM10:</label>
        <input type="number" step="0.01" name="pm10" required><br>
    
        <label for="pm25">PM2.5:</label>
        <input type="number" step="0.01" name="pm25" required><br>
    
        <label for="co">CO:</label>
        <input type="number" step="0.01" name="co" required><br>
    
        <label for="hc">HC:</label>
        <input type="number" step="0.01" name="hc" required><br>
    
        <label for="o3">O3:</label>
        <input type="number" step="0.01" name="o3" required><br>
    
        <label for="no2">NO2:</label>
        <input type="number" step="0.01" name="no2" required><br>
    
        <label for="so2">SO2:</label>
        <input type="number" step="0.01" name="so2" required><br>
    
        <button type="submit">Predict</button>
    </form>
    

    {% if prediction is not none %}
    <h2>Prediction Result: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
