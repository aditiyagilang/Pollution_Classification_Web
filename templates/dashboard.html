<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar dan Tabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUa5lG2lubx7KdDh5GE1bHfn9S3r5MWR6Wt5oE2saNQFgeN9T8YbWZ7s1eD3"
    crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/data-table.css') }}">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
     
      <ul class="menu">
        <li class="menu-item active">
            <img class="icon"    src="{{ url_for('static', filename='assets/icon_home.png') }}" />
          <span>Dashboard</span>
        </li>
        <li class="menu-item" onclick="window.location.href='/lokasi'">
          <img class="icon" src="{{ url_for('static', filename='assets/icon_map.png') }}" />
          <span>Lokasi</span>
        </li>
        
        <!-- <li class="menu-item">
          <img class="icon"    src="{{ url_for('static', filename='assets/icon_polusi.png') }}" />
          <span>Polusi</span>
        </li> -->
        <li class="menu-item">
            <img class="icon"    src="{{ url_for('static', filename='assets/icon_kasifikasi.png') }}" />
          <span>Klasifikasi</span>
        </li>
       
      </ul>
      <div class="exit">
        <img class="icon"    src="{{ url_for('static', filename='assets/icon_exit.png') }}" />
        <span>Exit</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content " >
   
      
        <div class="monitoring-overview">

          <div class="overview-data">
            <div class="data-card">
              <p>Temperature</p>
              <h3>25°C</h3>
              <p>Today</p>
            </div>
            <div class="data-card">
              <p>Humidity</p>
              <h3>60%</h3>
              <p>Today</p>
            </div>
            <div class="data-card">
              <p>Air Pollution Image</p>
              <h3>35%</h3>
              <p>Today</p>
            </div>
            <div class="data-card">
              <p>Air Quality</p>
              <h3>85</h3>
              <p>Today</p>
            </div>
          </div>
        </div>

        <div class="air-quality-chart">
          <h3>Air Quality Chart</h3>
          <p>Air quality index (AQI) forecast</p>
          <canvas id="airQualityChart" width="400" height="200"></canvas>
        </div>
   
  </div>


  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>

const navLinks = document.querySelectorAll('.nav-links li a');

navLinks.forEach(link => {
link.addEventListener('click', () => {

  navLinks.forEach(nav => nav.classList.remove('active'));

  link.classList.add('active');
});
});

const ctx = document.getElementById('airQualityChart').getContext('2d');
const airQualityChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
    datasets: [{
      label: 'AQI',
      data: [50, 100, 250, 200, 150, 180, 120], // Dummy data
      backgroundColor: 'rgba(75, 192, 192, 0.2)',
      borderColor: 'rgba(75, 192, 192, 1)',
      borderWidth: 2,
      tension: 0.3
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        display: false
      }
    },
    scales: {
      x: {
        title: {
          display: true,
          text: 'Days'
        }
      },
      y: {
        title: {
          display: true,
          text: 'AQI'
        },
        min: 0,
        max: 300
      }
    }
  }
});
</script>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
